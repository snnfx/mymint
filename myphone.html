<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ข้อความจากพี่ 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Itim&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    font-family:'Prompt',sans-serif;

    background:
        radial-gradient(
            circle at 20% 20%,
            #9edcff,
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            #fff0a8,
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #b9e5ff,
            #dff4ff,
            #fff8d7
        );
}


/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}


/* เมฆ */

.cloud{
    position:absolute;
    background:rgba(255,255,255,.75);
    width:150px;
    height:45px;
    border-radius:50px;

    animation:cloudMove 35s linear infinite;
}

.cloud::before{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    background:inherit;
    border-radius:50%;
    left:25px;
    top:-25px;
}

.cloud::after{
    content:"";
    position:absolute;
    width:80px;
    height:80px;
    background:inherit;
    border-radius:50%;
    left:70px;
    top:-35px;
}

.cloud1{
    top:12%;
    left:-200px;
}

.cloud2{
    top:30%;
    left:-250px;
    transform:scale(.7);
    opacity:.5;
    animation-duration:45s;
    animation-delay:10s;
}

@keyframes cloudMove{
    from{
        transform:translateX(-250px);
    }

    to{
        transform:translateX(120vw);
    }
}


/* ดอกไม้พื้นหลัง */

.bg-flower{
    position:absolute;
    font-size:30px;
    opacity:.25;

    animation:
        flowerFloat 5s ease-in-out infinite;
}

@keyframes flowerFloat{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-20px) rotate(8deg);
    }
}


/* =========================
   PHONE
========================= */

.phone{

    position:relative;

    width:390px;
    height:780px;

    border-radius:48px;

    background:#101418;

    padding:11px;

    box-shadow:
        0 35px 80px
        rgba(45,100,130,.35),

        0 0 0 2px
        rgba(255,255,255,.45);

    animation:
        phoneFloat 4s ease-in-out infinite;

    z-index:5;
}

@keyframes phoneFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}


/* =========================
   SCREEN
========================= */

.screen{

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:39px;

    background:
        linear-gradient(
            180deg,
            #dff4ff,
            #f5fbff
        );

    position:relative;
}


/* =========================
   STATUS BAR
========================= */

.status{

    height:38px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 20px;

    font-size:12px;

    color:#4f6877;

    font-weight:500;
}


/* =========================
   CHAT HEADER
========================= */

.header{

    height:67px;

    background:
        rgba(255,255,255,.85);

    border-bottom:
        1px solid
        rgba(120,180,210,.18);

    display:flex;

    align-items:center;

    padding:0 18px;

    gap:12px;

    backdrop-filter:blur(10px);
}


.avatar{

    width:43px;
    height:43px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:25px;

    background:
        linear-gradient(
            135deg,
            #ffe47b,
            #ffc83d
        );

    box-shadow:
        0 4px 10px
        rgba(230,180,50,.2);
}


.header-info{
    flex:1;
}


.header-name{

    font-size:15px;

    font-weight:500;

    color:#38566b;
}


.online{

    font-size:11px;

    color:#6db5d5;

    margin-top:2px;
}


.header-flower{
    font-size:23px;
}


/* =========================
   CHAT AREA
========================= */

.chat{

    height:
        calc(100% - 105px);

    padding:
        22px 15px 80px;

    overflow-y:auto;

    scroll-behavior:smooth;
}


/* วันที่ */

.date{

    text-align:center;

    font-size:10px;

    color:#8ca8b8;

    margin-bottom:18px;
}


/* =========================
   MESSAGE
========================= */

.message-row{

    display:flex;

    margin-bottom:12px;

    align-items:flex-end;
}


.message-row.right{

    justify-content:flex-end;
}


.avatar-small{

    width:28px;
    height:28px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#ffd85c;

    font-size:17px;

    margin-right:7px;
}


.bubble{

    max-width:78%;

    padding:
        10px 14px;

    border-radius:
        18px 18px 18px 5px;

    background:#fff;

    color:#536b7a;

    font-size:13px;

    line-height:1.75;

    box-shadow:
        0 3px 10px
        rgba(70,130,160,.08);

    animation:
        messageIn .5s ease;
}


.right .bubble{

    border-radius:
        18px 18px 5px 18px;

    background:
        #75c6f1;

    color:white;

    box-shadow:
        0 4px 12px
        rgba(65,160,210,.18);
}


@keyframes messageIn{

    from{
        opacity:0;
        transform:
            translateY(8px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   SUNFLOWER MESSAGE
========================= */

.flower-card{

    margin:
        15px auto;

    width:145px;

    padding:12px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #fffdf1,
            #fff7ce
        );

    text-align:center;

    box-shadow:
        0 5px 18px
        rgba(190,160,60,.12);

    animation:
        flowerAppear 1s ease;
}


.flower-card .flower{

    font-size:65px;

    display:block;

    animation:
        flowerSway 3s ease-in-out infinite;
}


.flower-card span{

    font-size:10px;

    color:#9a8750;
}


@keyframes flowerAppear{

    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


@keyframes flowerSway{

    0%,100%{
        transform:rotate(-4deg);
    }

    50%{
        transform:rotate(4deg);
    }
}


/* =========================
   TYPING
========================= */

.typing{

    display:flex;

    gap:4px;

    padding:
        11px 14px;

    background:#fff;

    border-radius:
        18px 18px 18px 5px;

    width:58px;

    box-shadow:
        0 3px 10px
        rgba(70,130,160,.08);
}


.dot{

    width:6px;
    height:6px;

    background:#8bbbd2;

    border-radius:50%;

    animation:
        typing 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}


/* =========================
   BOTTOM BAR
========================= */

.bottom{

    position:absolute;

    bottom:0;
    left:0;
    right:0;

    padding:
        10px 15px 15px;

    background:
        rgba(255,255,255,.88);

    backdrop-filter:blur(12px);

    display:flex;

    gap:8px;
}


.input{

    flex:1;

    height:38px;

    border-radius:20px;

    background:#edf7fb;

    display:flex;

    align-items:center;

    padding:
        0 15px;

    color:#9ab0bc;

    font-size:11px;
}


.send{

    width:38px;
    height:38px;

    border-radius:50%;

    border:none;

    background:#72c5ed;

    color:white;

    cursor:pointer;

    font-size:17px;

    transition:.3s;
}


.send:hover{

    transform:scale(1.1);

}


/* =========================
   MUSIC
========================= */

.music{

    position:fixed;

    bottom:20px;
    right:20px;

    padding:
        8px 14px;

    border-radius:20px;

    background:
        rgba(255,255,255,.7);

    color:#5d8da6;

    font-size:11px;

    z-index:20;

    box-shadow:
        0 5px 15px
        rgba(50,100,130,.12);
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .phone{

        width:340px;
        height:700px;

        border-radius:42px;

        padding:9px;
    }

    .screen{
        border-radius:34px;
    }

    .bubble{
        font-size:12px;
    }

    .music{
        display:none;
    }
}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="background">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div
        class="bg-flower"
        style="left:8%;top:20%;"
    >
        🌻
    </div>

    <div
        class="bg-flower"
        style="right:8%;top:65%;"
    >
        🌼
    </div>

    <div
        class="bg-flower"
        style="left:15%;bottom:10%;"
    >
        🌻
    </div>

    <div
        class="bg-flower"
        style="right:15%;top:12%;"
    >
        ✨
    </div>

</div>


<!-- PHONE -->

<div class="phone">

    <div class="screen">


        <!-- STATUS -->

        <div class="status">

            <span id="time">
                09:41
            </span>

            <span>
                ● ● ▰
            </span>

        </div>


        <!-- HEADER -->

        <div class="header">

            <div class="avatar">
                🌻
            </div>

            <div class="header-info">

                <div class="header-name">
                    มิ้น
                </div>

                <div class="online">
                    พี่กำลังส่งข้อความ...
                </div>

            </div>

            <div class="header-flower">
                💙
            </div>

        </div>


        <!-- CHAT -->

        <div
            class="chat"
            id="chat"
        >

            <div class="date">
                วันนี้
            </div>


            <!-- message 1 -->

            <div class="message-row right">

                <div class="bubble">

                    มิ้นนน 👋

                </div>

            </div>


            <!-- typing -->

            <div
                class="message-row"
                id="typing1"
            >

                <div class="avatar-small">
                    🧑🏻
                </div>

                <div class="typing">

                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>

                </div>

            </div>


        </div>


        <!-- INPUT -->

        <div class="bottom">

            <div class="input">
                ข้อความจากพี่...
            </div>

            <button
                class="send"
                onclick="sendNext()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- MUSIC -->

<iframe
    id="music"
    width="0"
    height="0"
    src="https://www.youtube.com/embed/rq9UXpw7IJE?enablejsapi=1&autoplay=0&loop=1&playlist=rq9UXpw7IJE"
    frameborder="0"
    allow="autoplay">
</iframe>


<div class="music">
    🎵 เพลงสำหรับมิ้น
</div>


<script>


/* =========================
   TIME
========================= */

function updateTime(){

    const now = new Date();

    let h =
        String(now.getHours()).padStart(2,'0');

    let m =
        String(now.getMinutes()).padStart(2,'0');

    document.getElementById("time")
        .textContent =
        h + ":" + m;
}

updateTime();

setInterval(updateTime,60000);


/* =========================
   CHAT
========================= */

const chat =
    document.getElementById("chat");


let step = 0;


const messages = [

`พี่ไม่รู้ว่าช่วงนี้มิ้นกำลังเจออะไรอยู่บ้าง`,

`แต่พี่แค่อยากทักมาบอกว่า พี่เป็นห่วงมิ้นนะ 💙`,

`ถ้าช่วงนี้เหนื่อย ๆ ก็พักบ้างนะ ไม่ต้องฝืนตัวเองมากเกินไป`,

`กินข้าวด้วยนะ อย่าปล่อยให้ตัวเองหิว แล้วก็นอนให้พอด้วย`,

`เรื่องไหนที่ยังจัดการไม่ได้วันนี้ เอาไว้ค่อย ๆ ทำวันหลังก็ได้`,

`ไม่จำเป็นต้องเก่งตลอดเวลาเลยนะ เหนื่อยก็พักได้ 🌻`,

`พี่ไม่ได้มีอะไรจะช่วยได้มากหรอก`,

`แต่อย่างน้อยก็อยากให้มิ้นรู้ว่า พี่คอยเป็นกำลังใจให้อยู่นะ`,

`ดูแลตัวเองดี ๆ นะมิ้น 🌻💙`

];


function sendNext(){

    if(step >= messages.length){

        createFlowers();

        return;
    }


    /* remove old typing */

    const oldTyping =
        document.getElementById("typing1");

    if(oldTyping){

        oldTyping.remove();

    }


    /* create message */

    const row =
        document.createElement("div");

    row.className =
        "message-row";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar-small";

    avatar.textContent =
        "🧑🏻";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        messages[step];


    row.appendChild(avatar);

    row.appendChild(bubble);

    chat.appendChild(row);


    /* sunflower after second message */

    if(step === 1){

        const flower =
            document.createElement("div");

        flower.className =
            "flower-card";

        flower.innerHTML = `

            <span class="flower">
                🌻
            </span>

            <span>
                ดอกทานตะวันเล็ก ๆ
                สำหรับเป็นกำลังใจนะ
            </span>

        `;

        chat.appendChild(flower);

    }


    step++;


    /* scroll */

    chat.scrollTop =
        chat.scrollHeight;


    /* typing next */

    if(step < messages.length){

        setTimeout(createTyping,900);

    }else{

        playMusic();

        createFlowers();

    }

}


/* =========================
   TYPING
========================= */

function createTyping(){

    const row =
        document.createElement("div");

    row.className =
        "message-row";

    row.id =
        "typing1";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar-small";

    avatar.textContent =
        "🧑🏻";


    const typing =
        document.createElement("div");

    typing.className =
        "typing";

    typing.innerHTML = `

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

    `;


    row.appendChild(avatar);

    row.appendChild(typing);

    chat.appendChild(row);


    chat.scrollTop =
        chat.scrollHeight;


    setTimeout(()=>{

        sendNext();

    },1300);

}


/* =========================
   MUSIC
========================= */

function playMusic(){

    document
        .getElementById("music")
        .src =
        "https://www.youtube.com/embed/rq9UXpw7IJE?enablejsapi=1&autoplay=1&loop=1&playlist=rq9UXpw7IJE&controls=0";

}


/* =========================
   FLOWERS
========================= */

function createFlowers(){

    const items = [
        "🌻",
        "🌼",
        "💙",
        "🩵",
        "✨",
        "🤍"
    ];


    for(let i=0;i<25;i++){

        const flower =
            document.createElement("div");

        flower.style.position="fixed";

        flower.style.left =
            Math.random()*100+"vw";

        flower.style.bottom="-30px";

        flower.style.fontSize =
            (15+Math.random()*18)+"px";

        flower.style.zIndex="30";

        flower.textContent =
            items[
                Math.floor(
                    Math.random()*items.length
                )
            ];


        flower.animate(

            [

                {
                    transform:
                        "translateY(0) rotate(0deg)",
                    opacity:0
                },

                {
                    transform:
                        "translateY(-100vh) rotate(180deg)",
                    opacity:1
                },

                {
                    transform:
                        "translateY(-110vh) rotate(250deg)",
                    opacity:0
                }

            ],

            {

                duration:
                    5000 +
                    Math.random()*4000,

                easing:
                    "ease-out"

            }

        );


        document.body.appendChild(flower);


        setTimeout(()=>{

            flower.remove();

        },10000);

    }

}

</script>

</body>
</html>
